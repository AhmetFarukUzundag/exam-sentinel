[project]
name = "exam-sentinel"
version = "0.1.0"
description = "Asenkron Sınav Denetim Hattı"
readme = "CONTEXT.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "silero-vad>=5.1.0",
    "av>=14.0.0",
    "pydantic>=2.0.0",
    "numpy>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
